name: mimalloc-benchmark

on:
  push:
  workflow_dispatch:

jobs:
  bench:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: install build deps (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev libssl-dev libexpat1-dev zlib1g-dev gettext

      - name: setup Git for Windows SDK
        if: matrix.os == 'windows-latest'
        uses: git-for-windows/setup-git-for-windows-sdk@v2
        with:
          flavor: minimal

      - name: build vanilla git
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then . /etc/profile; fi
          mkdir -p _bench/vanilla
          make NO_PERL=YesPlease NO_TCLTK=YesPlease NO_GETTEXT=YesPlease -j4 all
          case "$RUNNER_OS" in
            Windows) cp git.exe _bench/vanilla/git.exe ;;
            *)       cp git     _bench/vanilla/git ;;
          esac
          make clean

      - name: build mimalloc git
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then . /etc/profile; fi
          mkdir -p _bench/mimalloc
          make NO_PERL=YesPlease NO_TCLTK=YesPlease NO_GETTEXT=YesPlease \
               USE_MIMALLOC=YesPlease -j4 all
          case "$RUNNER_OS" in
            Windows) cp git.exe _bench/mimalloc/git.exe ;;
            *)       cp git     _bench/mimalloc/git ;;
          esac

      - name: prepare benchmark repo (linux.git subset reachable from 93a6fefe2f)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then . /etc/profile; fi
          SHA=93a6fefe2f6fc380870c0985b246bec7f37a06f7
          git init --bare _bench/template.git
          git -C _bench/template.git remote add origin https://github.com/torvalds/linux
          git -C _bench/template.git fetch --no-tags --depth=50000 origin "$SHA"
          git -C _bench/template.git update-ref refs/heads/master "$SHA"
          git -C _bench/template.git reflog expire --all --expire=now
          git -C _bench/template.git gc --prune=now
          echo "objects on master: $(git -C _bench/template.git rev-list --count refs/heads/master)"

      - name: run benchmark
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            . /etc/profile
            # `. /etc/profile` resets PATH to the SDK's own; re-expose the
            # Python that `actions/setup-python` installed via the
            # `pythonLocation` env var the action records.
            export PATH="$(cygpath "$pythonLocation"):$PATH"
            ext=.exe
          else
            ext=
          fi
          python ci/bench-mimalloc.py \
            --vanilla "./_bench/vanilla/git${ext}" \
            --mimalloc "./_bench/mimalloc/git${ext}" \
            --template _bench/template.git \
            --work _bench/run.git \
            --results _bench/results.csv \
            --iterations 5

      - name: upload results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: bench-${{ matrix.os }}
          path: _bench/results.csv
