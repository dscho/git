name: mimalloc-benchmark

on:
  push:
  workflow_dispatch:

jobs:
  bench:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: install build deps (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev libssl-dev libexpat1-dev zlib1g-dev gettext

      - name: setup Git for Windows SDK
        if: matrix.os == 'windows-latest'
        uses: git-for-windows/setup-git-for-windows-sdk@v2
        with:
          flavor: minimal

      - name: build vanilla git
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then . /etc/profile; fi
          mkdir -p _bench
          make NO_PERL=YesPlease NO_TCLTK=YesPlease NO_GETTEXT=YesPlease -j4 all
          case "$RUNNER_OS" in
            Windows) cp git.exe _bench/git-vanilla.exe ;;
            *)       cp git     _bench/git-vanilla ;;
          esac
          make clean

      - name: build mimalloc git
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then . /etc/profile; fi
          make NO_PERL=YesPlease NO_TCLTK=YesPlease NO_GETTEXT=YesPlease \
               USE_MIMALLOC=YesPlease -j4 all
          case "$RUNNER_OS" in
            Windows) cp git.exe _bench/git-mimalloc.exe ;;
            *)       cp git     _bench/git-mimalloc ;;
          esac

      - name: prepare benchmark repo (linux.git subset reachable from 93a6fefe2f)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then . /etc/profile; fi
          SHA=93a6fefe2f6fc380870c0985b246bec7f37a06f7
          git init --bare _bench/template.git
          git -C _bench/template.git remote add origin https://github.com/torvalds/linux
          git -C _bench/template.git fetch --no-tags --depth=50000 origin "$SHA"
          git -C _bench/template.git update-ref refs/heads/master "$SHA"
          git -C _bench/template.git reflog expire --all --expire=now
          git -C _bench/template.git gc --prune=now
          du -sh _bench/template.git

      - name: run benchmark
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then . /etc/profile; fi
          case "$RUNNER_OS" in
            Windows) ext=.exe ;;
            *)       ext= ;;
          esac
          python3 ci/bench-mimalloc.py \
            --vanilla "./_bench/git-vanilla${ext}" \
            --mimalloc "./_bench/git-mimalloc${ext}" \
            --template _bench/template.git \
            --work _bench/run.git \
            --results _bench/results.csv \
            --iterations 5

      - name: upload results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: bench-${{ matrix.os }}
          path: _bench/results.csv
